<style>
/* Placement Atlas: signage-like Archivo headings, Public Sans text, one brand blue plus a signal red for time.
   The memorable element is the application-year route line; everything else stays quiet. */
:root{

  --hi:#fff0a3; --hi-fg:#5a4300;

  --foot-bg:#18202f; --foot-fg:#c3c9d4;
  --head:"Archivo","Segoe UI",system-ui,sans-serif; --sans:"Public Sans","Segoe UI",system-ui,sans-serif;
  --serif:var(--head);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--surface:#1a1e26;--fg:#e8eaee;--muted:#a2a8b5;--line:#2b303a;--line-strong:#3b4250;--ink:#9fb1ff;--ink-soft:#232b48;--signal:#ff8a7d;--signal-soft:#3a2220;--hi:#5a4b10;--hi-fg:#ffe98a;--ok:#80d49c;--ok-soft:#1b3125;--check:#f0c063;--check-soft:#352c16;--no:#f49c93;--no-soft:#3a2120;--foot-bg:#0c0e12;--foot-fg:#a2a8b5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151b;--surface:#1a1e26;--fg:#e8eaee;--muted:#a2a8b5;--line:#2b303a;--line-strong:#3b4250;--ink:#9fb1ff;--ink-soft:#232b48;--signal:#ff8a7d;--signal-soft:#3a2220;--hi:#5a4b10;--hi-fg:#ffe98a;--ok:#80d49c;--ok-soft:#1b3125;--check:#f0c063;--check-soft:#352c16;--no:#f49c93;--no-soft:#3a2120;--foot-bg:#0c0e12;--foot-fg:#a2a8b5;color-scheme:dark}
:lang(zh-Hant-HK) body,:root:lang(zh-Hant-HK){--sans:"Public Sans","PingFang HK","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;--head:"Archivo","PingFang HK","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
html{scroll-behavior:smooth;scroll-padding-top:76px}

/* Top bar */

/* Hero */

/* Application-year route line */
.cycle{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.cy-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.cy-head .sub{color:var(--muted);font-size:15px;margin:0}

.cy-track{position:relative;min-width:680px;padding-top:26px}
.cy-bands{position:relative;height:128px}
.cy-band{position:absolute;z-index:1;height:26px;border-radius:13px;font-size:14px;font-weight:600;padding:0 12px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}

.cy-months span{padding:8px 0 0 4px;border-left:1px solid var(--line)}
.cy-months span.cur{color:var(--fg);font-weight:700}
.cy-now{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--signal)}
.cy-now>span{position:absolute;top:0;left:6px;font-size:12px;font-weight:700;color:var(--signal);white-space:nowrap}
.cy-now::after{content:"";position:absolute;left:-7px;bottom:22px;width:12px;height:12px;border-radius:50%;background:var(--signal);border:2px solid var(--surface)}
.cy-dates{list-style:none;margin:0;padding:12px 0 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 28px;font-size:15px}
.cy-dates time{font-family:var(--head);font-weight:700;color:var(--signal)}
.cy-dates .left{color:var(--muted);font-size:14px}

/* Two-column layout */
.layout{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:28px;align-items:start}
.side{display:flex;flex-direction:column;gap:16px}
@media (min-width:901px){.side{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow-y:auto;overscroll-behavior:contain;padding:0 6px 8px 0;scrollbar-width:thin}}
.results{display:flex;flex-direction:column;gap:20px;min-width:0}
.side .fields,.side .toolbar{grid-template-columns:1fr}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.side .fields,.side .toolbar{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}}

/* Panels and forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:19px}
.panel p{margin:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.needs label,.track label{font-size:14px;font-weight:600;color:var(--fg)}
select,textarea,input[type=text],input[type=url],input[type=number],input[type=search],input[type=email]{font:15px var(--sans);color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:9px 10px;width:100%;box-sizing:border-box}
textarea{min-height:70px;resize:vertical}
.needs{display:flex;flex-direction:column;gap:4px}
.actions{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.btn{font:600 15px var(--sans);border-radius:8px;padding:9px 18px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--surface);text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.55;cursor:default}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hint{font-size:14px;color:var(--muted);margin:0}
.result{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.matches{display:flex;flex-direction:column;gap:10px;margin:0;padding-left:20px}
.match a.jump{font-weight:600}
.match .step{display:block;color:var(--muted);font-size:14px}
.ideas{margin:0;padding-left:20px}
details.visa{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 20px}
details.visa summary{cursor:pointer;font-weight:600;font-size:15px}
details.visa ul{margin:10px 0 0;padding-left:20px;display:grid;gap:8px;font-size:15px}
.toolbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 20px}
.toggle{display:flex;align-items:center;gap:8px;font-size:15px}
.side>.toggle{padding:0 4px}
.count{color:var(--muted);font-size:15px;margin:0}
.fit{margin:0;padding:10px 12px;background:var(--ink-soft);border-radius:8px}
mark,.hl-text{background:var(--hi);color:var(--hi-fg);padding:0 4px;border-radius:2px}
.signin{display:flex;gap:8px;flex-wrap:wrap}.signin input{flex:1 1 200px;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--fg)}
.sets{border:0;padding:0;margin:8px 0}.sets legend{font-weight:600;margin-bottom:4px}.sets .toggle{display:flex;margin:6px 0}
.danger{color:var(--no)}
.linkbtn{font:inherit;background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Listing sheets */
section.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px 6px}
section.list>h2{margin-bottom:4px}
section.list>.sub{color:var(--muted);font-size:15px;margin:0 0 10px;max-width:70ch}
.item{border-top:1px solid var(--line);padding:18px 0;display:flex;flex-direction:column;gap:5px;min-width:0;scroll-margin-top:80px}
.item.closed{opacity:.55}
.item.hl{background:var(--ink-soft);margin:0 -14px;padding-left:14px;padding-right:14px;border-radius:10px}
.item-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.when-tag{font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--signal-soft);color:var(--signal)}
.when-tag.closed{background:transparent;color:var(--muted);padding:0}
.when-tag.open{background:var(--ok-soft);color:var(--ok)}
.when-tag.soon{background:var(--ink-soft);color:var(--ink)}
.role{margin:0;font-weight:500}
.where{color:var(--muted);font-weight:400}
.facts{margin:0;color:var(--muted);font-size:15px}
.elig{margin:4px 0 0;font-size:14px;font-weight:500;align-self:flex-start;padding:3px 10px;border-radius:6px}
.elig.e-ok{color:var(--ok);background:var(--ok-soft)}.elig.e-check{color:var(--check);background:var(--check-soft)}.elig.e-no{color:var(--no);background:var(--no-soft)}.elig.e-none{color:var(--muted);background:var(--bg)}
.item details{margin-top:2px}
.item summary{cursor:pointer;color:var(--ink);font-size:15px;width:max-content;max-width:100%}
.more{display:flex;flex-direction:column;gap:8px;padding:10px 0 0;font-size:15px}
.more p{margin:0;max-width:65ch}
.track{display:grid;grid-template-columns:1fr;gap:6px;max-width:420px;margin-top:4px}
.mystatus{margin:0;font-size:14px;color:var(--ink);font-weight:600}
.cal{font-size:15px}
.apply{margin:8px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:15px}
.btn.small{font-size:14px;padding:7px 14px;display:inline-block}
.apply .via{color:var(--muted);font-size:13px}
.copy{font:500 13px var(--sans);border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:6px;padding:3px 9px;cursor:pointer}

/* Guide area */
.extras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start;padding-top:12px;border-top:1px solid var(--line-strong)}
.extras>section[aria-labelledby="mf"],.extras>.acct{grid-column:1/-1}
.acct .signin{max-width:560px}
.extras>section.list{padding-bottom:22px}
@media (max-width:760px){.extras{grid-template-columns:minmax(0,1fr)}}
.boards{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 16px;margin:0;font-size:15px}
.boards dt{color:var(--muted)}
.boards dd{margin:0;min-width:0;overflow-wrap:anywhere}

footer{background:var(--foot-bg);color:var(--foot-fg);font-size:14px;border-radius:16px 16px 0 0;padding:24px;display:flex;flex-direction:column;gap:8px;margin-top:12px}

.skip{position:absolute;left:-999px;top:8px;z-index:10;background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600}
.skip:focus{left:16px}
.bname{white-space:nowrap}
.ls{display:none}
@media (max-width:480px){.lf{display:none}.ls{display:inline}.langbtn{min-width:44px;min-height:40px}.signin-link{min-height:40px;display:inline-flex;align-items:center}}
details.prof>summary,details.filters>summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:4px}

.sumrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sumrow .edit{font-size:14px;font-weight:600;color:var(--ink)}
details.prof[open] .sumrow .edit{display:none}
.prof-sum{font-size:14px;color:var(--muted)}
details.prof[open] .prof-sum{display:none}
details.prof:not([open]){gap:0}
details.prof[open]>summary{margin-bottom:12px}

details.filters[open]>summary::before{transform:rotate(45deg)}
details.filters .n{color:var(--ink)}
details.filters .toolbar{background:none;border:0;padding:0;margin-top:12px}
details.filters .toggle{margin-top:12px}
.dline{margin:0;font-size:15px}
.dline b{font-weight:600}
details.spec{border-top:1px solid var(--line);padding:16px 0}

details.spec>summary::-webkit-details-marker{display:none}
.spec-t{font-family:var(--head);font-weight:700;font-size:18px;color:var(--fg)}

.about p{max-width:75ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}html{scroll-behavior:auto}}

async function initAccounts(){

  try{
    await new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)});
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,detectSessionInUrl:true,flowType:"implicit"}});
    sb.auth.onAuthStateChange(async(ev,session)=>{
      const was=user&&user.id;user=session?session.user:null;
      if(user&&was!==user.id){await cloudPull();await pushState();acct.msg="";if(location.hash.includes("access_token"))history.replaceState(null,"",location.pathname)}
      render();
    });
    const{data}=await sb.auth.getSession();user=data.session?data.session.user:null;
    if(user){await cloudPull();await pushState()}
    render();
  }catch(e){acct.msg=L("Sign-in isn't available right now.","暫時未能登入。");render()}
}

  ${group("easter",L("Insight weeks and spring","體驗週及春季計劃"),L("Short programmes and Easter work experience. Most open over winter, so this is where to start.","短期計劃及復活節工作經驗。大多在冬季開放，可以先從這裡開始。"))}${group("summer",L("Summer work","暑期工"),L("Internships and work experience. Government and big-company schemes mostly close between January and April; small firms are happy to hear from you in February or March.","實習及工作經驗。政府及大企業的計劃大多在 1 月至 4 月截止；小公司則歡迎你在 2 月或 3 月主動聯絡。"))}${group("school",L("Summer schools","暑期學校"),L("Short summer study in Hong Kong.","在香港的短期暑期課程。"))}
  ${vis.length?"":(prof.subj&&subjMode==="rel"&&!q?`<p class="hint">${L(`No Hong Kong listings for ${esc(T(SUBJ[prof.subj]))} yet. Use the buttons above to see jobs open to any degree, or try the job boards below.`,`暫時未有${esc(T(SUBJ[prof.subj]))}相關的香港職位。可以用上面的按鈕查看不限學科的職位，或看看下面的求職網站。`)}</p>`:`<p class="hint">${L(`Nothing matches${q?` "${esc(q)}"`:""} yet. Try another word, clear the filters, or check the job boards below.`,`暫時找不到${q?`「${esc(q)}」`:""}的結果。試試其他字眼、清除篩選，或看看下面的求職網站。`)}</p>`)}
  </div></div>
  <div class="extras" id="guide">

  <section class="panel" aria-labelledby="pm"><h2 id="pm">${L("Join your professional body as a student","以學生身份加入專業學會")}</h2><p>${L("It's free or nearly free, it looks good on applications, and it gets you into events where you meet people who hire. For planning and real estate:","免費或差不多免費，對申請有幫助，又可以參加活動認識業界人士。規劃及地產學生可考慮：")}</p>
  <dl class="boards"><dt>HKIS</dt><dd>${L("Surveying (Hong Kong)","測量（香港）")} · <b>${L("HK$70 a year","每年 HK$70")}</b> · ${L("check your degree is recognised first","先確認你的學位獲認可")} · <a href="https://wwww.hkis.org.hk/en/membership_become.html" target="_blank" rel="noopener">${L("Details","詳情")}</a></dd><dt>RICS</dt><dd>${L("Surveying and real estate","測量及地產")} · <b>${L("free","免費")}</b> · <a href="https://rics.org/join-rics/rics-member-grades/rics-student" target="_blank" rel="noopener">${L("Join","加入")}</a></dd></dl>
  <p class="hint">${L("Other subjects: ask your department which Hong Kong body to join, for example the HKIE for engineering or the HKICPA for accounting.","其他學科：問你的學系應加入哪個香港學會，例如工程可考慮 HKIE，會計可考慮 HKICPA。")}</p></section>
  <section aria-labelledby="jb" class="list"><h2 id="jb">${L("Where else to look","還可以去哪裡找")}</h2><p class="sub">${L("No single page can list everything. These are the job boards I'd check, plus your university careers service.","沒有一個網頁可以列出所有機會。以下是我會查看的求職網站，另外記得用大學的就業服務。")}</p>
  <dl class="boards">${BOARDS.map(([k,list])=>`<dt>${esc(T(k))}</dt><dd>${list.map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(T(n))}</a>`).join(" · ")}</dd>`).join("")}</dl></section>
  ${!comm&&FEEDBACK_URL?`<section class="panel" aria-labelledby="fb2"><h2 id="fb2">${L("Spotted a mistake or a missing scheme?","發現錯誤或遺漏？")}</h2><p>${L("Tell me. I read every message and fix things quickly.","請告訴我，我會細閱每個訊息並盡快更正。")}</p><p><a class="btn" href="${esc(FEEDBACK_URL)}" target="_blank" rel="noopener">${L("Send feedback","提供意見")}</a></p></section>`:""}
  ${comm?`<section class="panel" id="fb-panel" aria-labelledby="fb"><h2 id="fb">${L("Spotted a mistake or a missing scheme?","發現錯誤或遺漏？")}</h2><p>${L("Tell me. I read every comment and fix things quickly.","請告訴我，我會細閱每個留言並盡快更正。")}</p><div class="actions"><button type="button" class="btn" id="fb-btn">${L("Leave feedback","留言")}</button></div></section>`:""}
  <section class="panel about" id="about" aria-labelledby="ab"><h2 id="ab">${L("About Placement Atlas","關於實習地圖")}</h2>
  <p>${L("Placement Atlas is made by a Hong Kong student at the University of Manchester, for Hong Kong students who want work experience back home, wherever they study. It's free, has no ads, and isn't linked to any employer or university.","實習地圖由一位在曼徹斯特大學讀書的香港學生製作，為想回香港累積工作經驗的香港學生而設，無論你在哪裡讀書。網站免費、沒有廣告，亦與任何僱主或大學無關。")}</p>
  <p><b>${L("How listings are checked.","如何核對資料。")}</b> ${L(`Every listing is checked against the employer's own page where there is one. Where an employer doesn't publish its scheme, the listing says which directory or careers page the details come from ("Via …"). All listings were last checked on ${dlong(LAST_CHECKED)}, and the whole list is rechecked every month.`,`每一項都會盡量對照僱主自己的網頁核實。如僱主沒有公開計劃，會註明資料來自哪個目錄或就業網頁（「經由……」）。所有資料最後核對日期為${dlong(LAST_CHECKED)}，整份清單每月重新核對一次。`)}</p>
  <p><b>${L("Found a mistake or a missing scheme?","發現錯誤或遺漏？")}</b> ${L("Email ","請電郵至 ")}<a href="mailto:${CONTACT}?subject=${encodeURIComponent("Placement Atlas feedback")}">${CONTACT}</a>${L(". Every listing also has an \"Is something wrong?\" link under Details.","。每一項的「詳情」內亦有「資料有錯？」連結。")}</p></section>
  </div>
  <footer><p>${L(`Last checked ${dlong(LAST_CHECKED)}. Deadlines and rules change, so always confirm on the official page before you apply. I'm not linked to any of the employers or universities listed.`,`最後核對：${dlong(LAST_CHECKED)}。截止日期及規定或有改變，申請前請務必在官方網頁確認。本站與列出的僱主及大學並無關連。`)}</p><p>${stored?(ACCOUNTS?L("If you don't sign in, your answers, statuses and notes stay in this browser only. If you sign in, they're also stored in a private database so they sync across your devices and power your reminders; only you can read them, and you can delete your account at any time.","如不登入，你的資料、進度及筆記只會留在這個瀏覽器。如登入，資料亦會儲存在私人資料庫，以便在不同裝置同步及發送提醒；只有你能讀取，亦可隨時刪除帳戶。"):L("Your answers, statuses, notes and finds stay in this browser. Nobody else can see them, including me.","你的資料、進度、筆記及記錄只會留在這個瀏覽器，其他人（包括我）都看不到。")):L("Your browser isn't letting this page save, so your answers will clear when you leave.","你的瀏覽器不允許本頁儲存資料，離開後資料會被清除。")}</p></footer>`;
}
function rerender(){const a=document.activeElement,id=a&&a.id,s=a&&a.selectionStart;render();if(id){const n=document.getElementById(id);if(n){n.focus();try{if(s!=null)n.setSelectionRange(s,s)}catch(e){}}}}
async function ask(){
  if(!sample||ai.busy)return;
  const ta=document.getElementById("p-needs");if(ta){prof.needs=ta.value;put(PKEY,prof)}
  ai={busy:true,result:null,error:"",ctl:new AbortController()};rerender();
  const listings=ROWS.map(r=>({id:r.id,org:r.org,role:r.role,field:FIELD[r.field][0],any_degree:!!r.anyDegree,country:REGION[r.region][0],place:r.place,season:r.season,when:r.when,pay:r.pay,deadline:r.deadline,eligibility_for_this_student:elig(r).t,details:r.how}));
  const lab={hkpr:"Hong Kong permanent resident",hkres:"Hong Kong resident (not permanent)",nl:"Non-local student at a Hong Kong university",other:"Other"};
  const wl={full:"unrestricted (e.g. BN(O) visa)",student:"Student visa only",none:"none"};
  const student={degree_subject:(SUBJ[prof.subj]||["not given"])[0],year_in_2026_27:prof.year||"not given",hong_kong_status:lab[prof.res]||"not given",university_location:prof.uni||"not given",age:prof.age||"not given",in_their_words:(prof.needs||"").slice(0,1500)};
  const today=new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
  const prompt=`You are a careers adviser for students (studying in Hong Kong or overseas) looking for internships, insight programmes or work experience in Hong Kong in 2027. Today is ${today}. Write the summary, why, first_step, other_ideas and caution in ${lang==="zh"?"Traditional Chinese as used in Hong Kong (繁體中文)":"British English"}.

Student:
${JSON.stringify(student)}

Listings (the only specific opportunities you may recommend by id; "eligibility_for_this_student" has already been worked out from their answers):
${JSON.stringify(listings)}

Task: pick up to 6 listings that genuinely fit this student's subject, year, location wishes and goals. Never recommend a listing whose eligibility starts with "Not open to you" or "不適用". "Any degree" listings are open to all subjects. If few listings fit their subject, recommend fewer and say so. Mention urgent deadlines first. For each, give one or two plain sentences on why it fits and one concrete first step. Then give up to 5 other ideas tailored to their subject and year, limited to Hong Kong employers, schemes or routes, and when such schemes usually open (never invent specific company deadlines). Add one short caution about visas or eligibility if relevant, otherwise an empty string.

Reply with only JSON in this shape:
{"summary":"one or two sentences","matches":[{"id":"listing id","why":"...","first_step":"..."}],"other_ideas":["..."],"caution":"..."}`;
  try{
    const r=await sample.json(prompt,{signal:ai.ctl.signal});
    ai={busy:false,result:(r&&typeof r==="object")?r:null,error:(r&&typeof r==="object")?"":L("The answer didn't come back in the right shape. Try again.","回覆格式不正確，請再試一次。"),ctl:null};
  }catch(e){
    const c=e&&e.code;
    if(c==="cancelled")ai={busy:false,result:null,error:"",ctl:null};
    else if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){sample=null;ai={busy:false,result:null,error:"",ctl:null}}
    else ai={busy:false,result:null,error:c==="rate_limited"?L("Too many requests just now. Try again in a little while.","請求太多，請稍後再試。"):c==="session_expired"?L("Sign in to Claude again, then try once more.","請重新登入 Claude 再試。"):c==="invalid_json"?L("The answer didn't come back in the right shape. Try again.","回覆格式不正確，請再試一次。"):L("Something went wrong while matching. Try again.","配對時出錯，請再試一次。"),ctl:null};
  }
  rerender();
}
function addCustom(){
  const g=id=>(document.getElementById(id)||{value:""}).value.trim();
  const org=g("c-org");if(!org){formMsg=L("Add the organisation name first.","請先填寫機構名稱。");rerender();return}
  const url=g("c-url");
  custom.items.push({id:"c"+Date.now(),org,role:g("c-role"),deadline:g("c-dl"),url:safeUrl(url)});
  put(CKEY,custom);formMsg=L("Added to your tracker.","已加入你的記錄。");render();
}
document.addEventListener("click",e=>{
  if(e.target.closest("#ac-send")){sendLink();return}
  if(e.target.closest("#ac-out")){sb&&sb.auth.signOut();user=null;acct.msg=L("Signed out. Your data stays on this device too.","已登出。資料亦會保留在這部裝置。");render();return}
  if(e.target.closest("#ac-del")){deleteMe();return}
  if(e.target.closest("#push-on")){pushOn();return}
  if(e.target.closest("#push-off")){pushOff();return}
  if(e.target.closest("#lang-btn")){lang=lang==="zh"?"en":"zh";try{localStorage.setItem(LKEY,lang)}catch(err){}cloudSave();formMsg="";render();const b=document.getElementById("lang-btn");if(b)b.focus();return}
  const sm=e.target.closest("[data-sm]");if(sm){subjMode=sm.dataset.sm;render();const n=document.getElementById("results");if(n)n.scrollIntoView({block:"start"});return}
  if(e.target.closest("#ask")){ask();return}
  if(e.target.closest("#stop")){ai.ctl&&ai.ctl.abort();return}
  const cp=e.target.closest("[data-copy]");if(cp){const v=cp.dataset.copy;const done=()=>{cp.textContent=L("Copied","已複製");setTimeout(()=>{cp.textContent=L("Copy email","複製電郵")},1500)};try{navigator.clipboard.writeText(v).then(done,()=>{cp.textContent=v})}catch(err){cp.textContent=v}return}
  if(e.target.closest("#c-add")){addCustom();return}
  if(e.target.closest("#p-clear")){prof=Object.assign(prof,{subj:"",year:"",res:"",uni:"",age:""});put(PKEY,prof);subjMode="rel";onlyMine=false;profOpenS=true;render();const n=document.getElementById("p-subj");if(n)n.focus();return}
  if(e.target.closest("#export")){exportCSV();return}
  if(e.target.closest("#fb-btn")&&comm){comm.openComposer({element:document.getElementById("fb-panel")}).catch(()=>{comm=null;rerender()});return}
  const d=e.target.closest("[data-del]");if(d){custom.items=custom.items.filter(c=>c.id!==d.dataset.del);put(CKEY,custom);formMsg=L("Removed.","已刪除。");render();return}
  const j=e.target.closest("[data-jump]");if(j){e.preventDefault();hl=j.dataset.jump;F={field:"all",region:"all",season:"all"};onlyMine=false;q="";if(!ROWS.some(r=>r.id===hl&&relevant(r)>=(subjMode==="any"?1:subjMode==="rel"?2:0)))subjMode="all";render();const n=document.getElementById("row-"+hl);if(n)n.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})}
});
document.addEventListener("change",e=>{const t=e.target;
  if(t.matches("select[data-id]")){state.status[t.dataset.id]=t.value;put(KEY,state);rerender();return}
  if(t.matches("select[data-flt]")){F[t.dataset.flt]=t.value;rerender();return}
  if(t.id==="f-sort"){sortBy=t.value;rerender();return}
  if(t.matches("[data-p]")&&t.dataset.p!=="needs"){if(t.dataset.p==="subj")subjMode="rel";prof[t.dataset.p]=t.value;put(PKEY,prof);rerender();return}
  if(t.matches("input[data-set]")){acct.set[t.dataset.set]=t.checked;cloudSave();return}
  if(t.id==="mine"){onlyMine=t.checked;render()}
});
function csvCell(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
async function exportCSV(){
  const rows=allRows().filter(r=>r.custom||(state.status[r.id]&&state.status[r.id]!=="Not started")||state.notes[r.id]);
  if(!rows.length){formMsg=L("Set a status or add a note on a listing first, then export.","請先為任何一項設定進度或加筆記，再下載。");rerender();return}
  const head=L("Organisation|Role|Location|Deadline|My status|My notes|Link","機構|職位|地點|截止日期|我的進度|我的筆記|連結").split("|");
  const lines=[head].concat(rows.map(r=>r.custom?[r.org,r.role,"",r.deadline,"","",r.url||""]:[rf(r,"org"),rf(r,"role"),T(REGION[r.region])||"",rf(r,"deadline"),lang==="zh"?STATZH[state.status[r.id]||"Not started"]:(state.status[r.id]||"Not started"),state.notes[r.id]||"",r.url||""]));
  const data=lines.map(l=>l.map(csvCell).join(",")).join("\n");
  try{if(dl){await dl.save({filename:"my-placement-tracker.csv",data:"﻿"+data})}else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+data],{type:"text/csv;charset=utf-8"}));a.download="my-placement-tracker.csv";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}formMsg=L("Tracker downloaded.","已下載記錄。")}
  catch(e){const c=e&&e.code;if(c==="declined"){formMsg=L("Download cancelled.","已取消下載。")}else if(c==="rate_limited"){formMsg=L("A download prompt is already open.","下載提示已開啟。")}else{dl=null;formMsg=L("Downloads aren't available here.","這裡不能下載。")}}
  rerender();
}
document.addEventListener("toggle",e=>{const d=e.target;if(d&&d.id==="prof-d")profOpenS=d.open;if(d&&d.id==="flt-d")fltOpenS=d.open;if(d&&d.dataset&&d.dataset.openId){if(d.open)OPEN.add(d.dataset.openId);else OPEN.delete(d.dataset.openId)}},true);
document.addEventListener("submit",e=>{if(e.target.id==="sform"){e.preventDefault();const i=document.getElementById("f-q");q=i?i.value.trim():"";F={field:"all",region:"all",season:"all"};render();const n=document.getElementById("results");if(n)n.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})}});
document.addEventListener("input",e=>{if(e.target.id==="f-q"){q=e.target.value;rerender()}if(e.target.id==="ac-email")acct.email=e.target.value});
document.addEventListener("keydown",e=>{if(e.target.id==="ac-email"&&e.key==="Enter"){e.preventDefault();sendLink()}});
document.addEventListener("focusout",e=>{const t=e.target;
  if(t.matches("textarea[data-id]")&&(state.notes[t.dataset.id]||"")!==t.value){state.notes[t.dataset.id]=t.value;put(KEY,state)}
  if(t.id==="p-needs"&&prof.needs!==t.value){prof.needs=t.value;put(PKEY,prof)}
});
render();
try{const h=location.hash;if(/^#row-[A-Za-z0-9_-]+$/.test(h)&&ROWS.some(r=>"row-"+r.id===h.slice(1))){hl=h.slice(5);render();const n=document.getElementById(h.slice(1));if(n)n.scrollIntoView({block:"start"})}}catch(e){}
initAccounts();
if(window.claude&&window.claude.use){window.claude.use("sample").then(s=>{if(s){sample=s;rerender()}}).catch(()=>{});window.claude.use("comments").then(c=>{if(c){comm=c;rerender()}}).catch(()=>{});window.claude.use("downloads").then(d=>{if(d){dl=d;rerender()}}).catch(()=>{})}
})();
