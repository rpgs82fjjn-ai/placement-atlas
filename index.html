  <div class="fields"><div class="field"><label for="c-org">${L("Organisation","機構")}</label><input type="text" id="c-org" maxlength="80"></div><div class="field"><label for="c-role">${L("Role","職位")}</label><input type="text" id="c-role" maxlength="120"></div><div class="field"><label for="c-dl">${L("Deadline","截止日期")}</label><input type="text" id="c-dl" maxlength="60" placeholder="${L("e.g. 15 January","例如：1 月 15 日")}"></div><div class="field"><label for="c-url">${L("Link (optional)","連結（選填）")}</label><input type="url" id="c-url" maxlength="400" placeholder="https://"></div></div>
  <div class="actions"><button type="button" class="btn" id="c-add">${L("Add to my tracker","加入我的記錄")}</button><button type="button" class="btn ghost" id="export">${L("Download my tracker (CSV)","下載我的記錄 (CSV)")}</button><span class="hint" aria-live="polite">${esc(formMsg)}</span></div>
  ${custom.items.length?custom.items.map(c=>rowHTML(Object.assign({custom:true},c))).join(""):""}
  </section>
  <section class="panel" aria-labelledby="pm"><h2 id="pm">${L("Join your professional body as a student","以學生身分加入專業學會")}</h2><p>${L("It's free or nearly free, it looks good on applications, and it gets you into events where you meet people who hire. For planning and real estate:","免費或差不多免費，對申請有幫助，又可以參加活動認識業界人士。規劃及地產學生可考慮：")}</p>
  <dl class="boards"><dt>HKIS</dt><dd>${L("Surveying (Hong Kong)","測量（香港）")} · <b>${L("HK$70 a year","每年 HK$70")}</b> · ${L("check your degree is recognised first","先確認你的學位獲認可")} · <a href="https://wwww.hkis.org.hk/en/membership_become.html" target="_blank" rel="noopener">${L("Details","詳情")}</a></dd><dt>RICS</dt><dd>${L("Surveying and real estate","測量及地產")} · <b>${L("free","免費")}</b> · <a href="https://rics.org/join-rics/rics-member-grades/rics-student" target="_blank" rel="noopener">${L("Join","加入")}</a></dd></dl>
  <p class="hint">${L("Other subjects: ask your department which Hong Kong body to join, for example the HKIE for engineering or the HKICPA for accounting.","其他學科：問你的學系應加入哪個香港學會，例如工程可考慮 HKIE，會計可考慮 HKICPA。")}</p></section>
  <section aria-labelledby="jb" class="list"><h2 id="jb">${L("Where else to look","還可以去哪裡找")}</h2><p class="sub">${L("No single page can list everything. These are the job boards I'd check, plus your university careers service.","沒有一個網頁可以列出所有機會。以下是我會查看的求職網站，另外記得用大學的就業服務。")}</p>
  <dl class="boards">${BOARDS.map(([k,list])=>`<dt>${esc(T(k))}</dt><dd>${list.map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(n)}</a>`).join(" · ")}</dd>`).join("")}</dl></section>
  ${!comm&&FEEDBACK_URL?`<section class="panel" aria-labelledby="fb2"><h2 id="fb2">${L("Spotted a mistake or a missing scheme?","發現錯誤或遺漏？")}</h2><p>${L("Tell me. I read every message and fix things quickly.","請告訴我，我會細閱每個訊息並盡快更正。")}</p><p><a class="btn" href="${esc(FEEDBACK_URL)}" target="_blank" rel="noopener">${L("Send feedback","提供意見")}</a></p></section>`:""}
  ${comm?`<section class="panel" id="fb-panel" aria-labelledby="fb"><h2 id="fb">${L("Spotted a mistake or a missing scheme?","發現錯誤或遺漏？")}</h2><p>${L("Tell me. I read every comment and fix things quickly.","請告訴我，我會細閱每個留言並盡快更正。")}</p><div class="actions"><button type="button" class="btn" id="fb-btn">${L("Leave feedback","留言")}</button></div></section>`:""}
  <footer><p>${L(`Last checked ${dlong(LAST_CHECKED)}. Deadlines and rules change, so always confirm on the official page before you apply. I'm not linked to any of the employers or universities listed.`,`最後核對：${dlong(LAST_CHECKED)}。截止日期及規定或有改變，申請前請務必在官方網頁確認。本站與列出的僱主及大學並無關連。`)}</p><p>${stored?L("Your answers, statuses, notes and finds stay in this browser. Nobody else can see them, including me.","你的資料、進度、筆記及記錄只會留在這個瀏覽器，其他人（包括我）都看不到。"):L("Your browser isn't letting this page save, so your answers will clear when you leave.","你的瀏覽器不允許本頁儲存資料，離開後資料會被清除。")}</p></footer>`;
}
function rerender(){const a=document.activeElement,id=a&&a.id,s=a&&a.selectionStart;render();if(id){const n=document.getElementById(id);if(n){n.focus();try{if(s!=null)n.setSelectionRange(s,s)}catch(e){}}}}
async function ask(){
  if(!sample||ai.busy)return;
  const ta=document.getElementById("p-needs");if(ta){prof.needs=ta.value;put(PKEY,prof)}
  ai={busy:true,result:null,error:"",ctl:new AbortController()};rerender();
  const listings=ROWS.map(r=>({id:r.id,org:r.org,role:r.role,field:FIELD[r.field][0],any_degree:!!r.anyDegree,country:REGION[r.region][0],place:r.place,season:r.season,when:r.when,pay:r.pay,deadline:r.deadline,eligibility_for_this_student:elig(r).t,details:r.how}));
  const lab={hkpr:"Hong Kong permanent resident",hkres:"Hong Kong resident (not permanent)",nl:"Non-local student at a Hong Kong university",other:"Other"};
  const wl={full:"unrestricted (e.g. BN(O) visa)",student:"Student visa only",none:"none"};
  const student={degree_subject:(SUBJ[prof.subj]||["not given"])[0],year_in_2026_27:prof.year||"not given",hong_kong_status:lab[prof.res]||"not given",university_location:prof.uni||"not given",age:prof.age||"not given",in_their_words:(prof.needs||"").slice(0,1500)};
  const today=new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
  const prompt=`You are a careers adviser for students (studying in Hong Kong or overseas) looking for internships, insight programmes or work experience in Hong Kong in 2027. Today is ${today}. Write the summary, why, first_step, other_ideas and caution in ${lang==="zh"?"Traditional Chinese as used in Hong Kong (繁體中文)":"British English"}.

Student:
${JSON.stringify(student)}

Listings (the only specific opportunities you may recommend by id; "eligibility_for_this_student" has already been worked out from their answers):
${JSON.stringify(listings)}

Task: pick up to 6 listings that genuinely fit this student's subject, year, location wishes and goals. Never recommend a listing whose eligibility starts with "Not open to you" or "不適用". "Any degree" listings are open to all subjects. If few listings fit their subject, recommend fewer and say so. Mention urgent deadlines first. For each, give one or two plain sentences on why it fits and one concrete first step. Then give up to 5 other ideas tailored to their subject and year, limited to Hong Kong employers, schemes or routes, and when such schemes usually open (never invent specific company deadlines). Add one short caution about visas or eligibility if relevant, otherwise an empty string.

Reply with only JSON in this shape:
{"summary":"one or two sentences","matches":[{"id":"listing id","why":"...","first_step":"..."}],"other_ideas":["..."],"caution":"..."}`;
  try{
    const r=await sample.json(prompt,{signal:ai.ctl.signal});
    ai={busy:false,result:(r&&typeof r==="object")?r:null,error:(r&&typeof r==="object")?"":L("The answer didn't come back in the right shape. Try again.","回覆格式不正確，請再試一次。"),ctl:null};
  }catch(e){
    const c=e&&e.code;
    if(c==="cancelled")ai={busy:false,result:null,error:"",ctl:null};
    else if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){sample=null;ai={busy:false,result:null,error:"",ctl:null}}
    else ai={busy:false,result:null,error:c==="rate_limited"?L("Too many requests just now. Try again in a little while.","請求太多，請稍後再試。"):c==="session_expired"?L("Sign in to Claude again, then try once more.","請重新登入 Claude 再試。"):c==="invalid_json"?L("The answer didn't come back in the right shape. Try again.","回覆格式不正確，請再試一次。"):L("Something went wrong while matching. Try again.","配對時出錯，請再試一次。"),ctl:null};
  }
  rerender();
}
function addCustom(){
  const g=id=>(document.getElementById(id)||{value:""}).value.trim();
  const org=g("c-org");if(!org){formMsg=L("Add the organisation name first.","請先填寫機構名稱。");rerender();return}
  const url=g("c-url");
  custom.items.push({id:"c"+Date.now(),org,role:g("c-role"),deadline:g("c-dl"),url:safeUrl(url)});
  put(CKEY,custom);formMsg=L("Added to your tracker.","已加入你的記錄。");render();
}
document.addEventListener("click",e=>{
  if(e.target.closest("#lang-btn")){lang=lang==="zh"?"en":"zh";try{localStorage.setItem(LKEY,lang)}catch(err){}formMsg="";render();const b=document.getElementById("lang-btn");if(b)b.focus();return}
  const sm=e.target.closest("[data-sm]");if(sm){subjMode=sm.dataset.sm;render();const n=document.getElementById("results");if(n)n.scrollIntoView({block:"start"});return}
  if(e.target.closest("#ask")){ask();return}
  if(e.target.closest("#stop")){ai.ctl&&ai.ctl.abort();return}
  const cp=e.target.closest("[data-copy]");if(cp){const v=cp.dataset.copy;const done=()=>{cp.textContent=L("Copied","已複製");setTimeout(()=>{cp.textContent=L("Copy email","複製電郵")},1500)};try{navigator.clipboard.writeText(v).then(done,()=>{cp.textContent=v})}catch(err){cp.textContent=v}return}
  if(e.target.closest("#c-add")){addCustom();return}
  if(e.target.closest("#export")){exportCSV();return}
  if(e.target.closest("#fb-btn")&&comm){comm.openComposer({element:document.getElementById("fb-panel")}).catch(()=>{comm=null;rerender()});return}
  const d=e.target.closest("[data-del]");if(d){custom.items=custom.items.filter(c=>c.id!==d.dataset.del);put(CKEY,custom);formMsg=L("Removed.","已刪除。");render();return}
  const j=e.target.closest("[data-jump]");if(j){e.preventDefault();hl=j.dataset.jump;F={field:"all",region:"all",season:"all"};onlyMine=false;render();const n=document.getElementById("row-"+hl);if(n)n.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})}
});
document.addEventListener("change",e=>{const t=e.target;
  if(t.matches("select[data-id]")){state.status[t.dataset.id]=t.value;put(KEY,state);rerender();return}
  if(t.matches("select[data-flt]")){F[t.dataset.flt]=t.value;rerender();return}
  if(t.id==="f-sort"){sortBy=t.value;rerender();return}
  if(t.matches("[data-p]")&&t.dataset.p!=="needs"){if(t.dataset.p==="subj")subjMode="rel";prof[t.dataset.p]=t.value;put(PKEY,prof);rerender();return}
  if(t.id==="mine"){onlyMine=t.checked;render()}
});
function csvCell(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
async function exportCSV(){
  const rows=allRows().filter(r=>r.custom||(state.status[r.id]&&state.status[r.id]!=="Not started")||state.notes[r.id]);
  if(!rows.length){formMsg=L("Set a status or add a note on a listing first, then export.","請先為任何一項設定進度或加筆記，再下載。");rerender();return}
  const head=L("Organisation|Role|Location|Deadline|My status|My notes|Link","機構|職位|地點|截止日期|我的進度|我的筆記|連結").split("|");
  const lines=[head].concat(rows.map(r=>r.custom?[r.org,r.role,"",r.deadline,"","",r.url||""]:[rf(r,"org"),rf(r,"role"),T(REGION[r.region])||"",rf(r,"deadline"),lang==="zh"?STATZH[state.status[r.id]||"Not started"]:(state.status[r.id]||"Not started"),state.notes[r.id]||"",r.url||""]));
  const data=lines.map(l=>l.map(csvCell).join(",")).join("\n");
  try{if(dl){await dl.save({filename:"my-placement-tracker.csv",data:"﻿"+data})}else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+data],{type:"text/csv;charset=utf-8"}));a.download="my-placement-tracker.csv";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}formMsg=L("Tracker downloaded.","已下載記錄。")}
  catch(e){const c=e&&e.code;if(c==="declined"){formMsg=L("Download cancelled.","已取消下載。")}else if(c==="rate_limited"){formMsg=L("A download prompt is already open.","下載提示已開啟。")}else{dl=null;formMsg=L("Downloads aren't available here.","這裡不能下載。")}}
  rerender();
}
document.addEventListener("toggle",e=>{const d=e.target;if(d&&d.dataset&&d.dataset.openId){if(d.open)OPEN.add(d.dataset.openId);else OPEN.delete(d.dataset.openId)}},true);
document.addEventListener("submit",e=>{if(e.target.id==="sform"){e.preventDefault();const i=document.getElementById("f-q");q=i?i.value.trim():"";F={field:"all",region:"all",season:"all"};render();const n=document.getElementById("results");if(n)n.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})}});
document.addEventListener("input",e=>{if(e.target.id==="f-q"){q=e.target.value;rerender()}});
document.addEventListener("focusout",e=>{const t=e.target;
  if(t.matches("textarea[data-id]")&&(state.notes[t.dataset.id]||"")!==t.value){state.notes[t.dataset.id]=t.value;put(KEY,state)}
  if(t.id==="p-needs"&&prof.needs!==t.value){prof.needs=t.value;put(PKEY,prof)}
});
render();
try{const h=location.hash;if(/^#row-[A-Za-z0-9_-]+$/.test(h)&&ROWS.some(r=>"row-"+r.id===h.slice(1))){hl=h.slice(5);render();const n=document.getElementById(h.slice(1));if(n)n.scrollIntoView({block:"start"})}}catch(e){}
if(window.claude&&window.claude.use){window.claude.use("sample").then(s=>{if(s){sample=s;rerender()}}).catch(()=>{});window.claude.use("comments").then(c=>{if(c){comm=c;rerender()}}).catch(()=>{});window.claude.use("downloads").then(d=>{if(d){dl=d;rerender()}}).catch(()=>{})}
})();
</script>
