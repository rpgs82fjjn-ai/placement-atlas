<style>
/* Layout: a single reading column like a printed student handbook; listings separated by rules, not boxed cards; one ink-blue accent and a highlighter for deadlines */
:root{
  --bg:#ffffff; --paper:#f4f5f7; --fg:#1b1f2a; --muted:#5b6170; --line:#e3e5ea;
  --ink:#2843b8; --ink-soft:#e9edfb; --hi:#fff0a3; --hi-fg:#5a4300;
  --ok:#21703f; --check:#8a5a00; --no:#a3322b;
  --serif:"Literata",Georgia,"Times New Roman",serif; --sans:"Work Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--paper:#1d2027;--fg:#e8e9ec;--muted:#a3a8b4;--line:#2c3039;--ink:#9db0ff;--ink-soft:#232a45;--hi:#5a4b10;--hi-fg:#ffe98a;--ok:#7fd49a;--check:#f0c060;--no:#f29a92;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171c;--paper:#1d2027;--fg:#e8e9ec;--muted:#a3a8b4;--line:#2c3039;--ink:#9db0ff;--ink-soft:#232a45;--hi:#5a4b10;--hi-fg:#ffe98a;--ok:#7fd49a;--check:#f0c060;--no:#f29a92;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-block:40px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:32px}
a{color:var(--ink);text-underline-offset:2px}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(32px,6vw,46px);line-height:1.08;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--serif);font-weight:700;font-size:24px;margin:0;text-wrap:balance}
h3{font-family:var(--sans);font-weight:600;font-size:18px;margin:0}
header{display:flex;flex-direction:column;gap:14px}
.intro{font-size:18px;max-width:62ch;margin:0}
.byline{color:var(--muted);font-size:14px;margin:0}
.soon{background:var(--paper);border-radius:6px;padding:12px 14px;font-size:15px;margin:0}
.soon b{font-weight:600}
mark,.hl-text{background:var(--hi);color:var(--hi-fg);padding:0 4px;border-radius:2px}
.panel{background:var(--paper);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px}
.panel p{margin:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.needs label,.track label{font-size:14px;font-weight:500;color:var(--fg)}
select,textarea,input[type=text],input[type=url],input[type=number],input[type=search]{font:15px var(--sans);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;box-sizing:border-box}
textarea{min-height:70px;resize:vertical}
.needs{display:flex;flex-direction:column;gap:4px}
.actions{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.btn{font:600 15px var(--sans);border-radius:6px;padding:9px 18px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.55;cursor:default}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hint{font-size:14px;color:var(--muted);margin:0}
.result{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.matches{display:flex;flex-direction:column;gap:10px;margin:0;padding-left:20px}
.match a.jump{font-weight:600}
.match .step{display:block;color:var(--muted);font-size:14px}
.ideas{margin:0;padding-left:20px}
details.visa{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0}
details.visa summary{cursor:pointer;font-weight:600}
details.visa ul{margin:10px 0 0;padding-left:20px;display:grid;gap:8px;font-size:15px}
.toolbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;align-items:end}

.toggle{display:flex;align-items:center;gap:8px;font-size:15px}
.count{color:var(--muted);font-size:15px;margin:0}
section.list{display:flex;flex-direction:column}
section.list>h2{margin-bottom:4px}
section.list>.sub{color:var(--muted);font-size:15px;margin:0 0 8px}
.item{border-top:1px solid var(--line);padding:18px 0;display:flex;flex-direction:column;gap:4px;min-width:0}
.item:last-child{border-bottom:1px solid var(--line)}
.item.closed{opacity:.55}
.item.hl{background:var(--ink-soft);margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:6px}
.item-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.when-tag{font-size:14px;font-weight:500;padding:0 6px;border-radius:2px;background:var(--hi);color:var(--hi-fg)}
.when-tag.closed{background:transparent;color:var(--muted);padding:0}
.when-tag.open{background:transparent;color:var(--ok);padding:0}
.role{margin:0}
.where{color:var(--muted)}
.facts{margin:0;color:var(--muted);font-size:15px}
.elig{margin:2px 0 0;font-size:15px}
.elig.e-ok{color:var(--ok)}.elig.e-check{color:var(--check)}.elig.e-no{color:var(--no)}.elig.e-none{color:var(--muted)}
.item details{margin-top:4px}
.item summary{cursor:pointer;color:var(--ink);font-size:15px;width:max-content;max-width:100%}
.more{display:flex;flex-direction:column;gap:8px;padding:10px 0 0;font-size:15px}
.more p{margin:0;max-width:65ch}
.track{display:grid;grid-template-columns:1fr;gap:6px;max-width:420px;margin-top:4px}
.mystatus{margin:0;font-size:14px;color:var(--ink);font-weight:500}
.cal{font-size:15px}
.apply{margin:6px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:15px}
.btn.small{font-size:14px;padding:6px 12px;text-decoration:none;display:inline-block}
.apply .via{color:var(--muted);font-size:13px}
.copy{font:500 13px var(--sans);border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:4px;padding:2px 8px;cursor:pointer}
.search{display:flex;gap:8px;align-items:stretch}
.search input{flex:1;min-width:0;font-size:17px;padding:11px 12px}
.search .btn{padding:0 22px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.boards{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:0;font-size:15px}
.boards dt{color:var(--muted)}
.boards dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:520px){.boards{grid-template-columns:minmax(0,1fr)}.boards dd{margin-bottom:6px}}
footer{color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:6px}
footer p{margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

  return `<div class="result" aria-live="polite">${r.summary?`<p>${esc(r.summary)}</p>`:""}
  ${ms.length?`<ol class="matches">${ms.map(m=>{const x=ROWS.find(y=>y.id===m.id);return `<li class="match"><a class="jump" href="#row-${x.id}" data-jump="${x.id}">${esc(x.org)}: ${esc(x.role)}</a> ${esc(m.why||"")}${m.first_step?`<span class="step">First step: ${esc(m.first_step)}</span>`:""}</li>`}).join("")}</ol>`:"<p>No listings on this page fit closely yet; see the ideas below and the job boards further down.</p>"}
  ${ideas.length?`<div><b>Other places to look for your subject</b><ul class="ideas">${ideas.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`:""}
  ${r.caution?`<p class="hint">${esc(r.caution)}</p>`:""}
  <p class="hint">AI suggestions use the listings on this page and general knowledge; they can be wrong. Always check eligibility on the source page.</p></div>`;
}

  const dkey=r=>{const tm=timing(r);if(tm&&tm.k==="closed")return 1e6;if(r.closes)return days(r.closes);if(r.opens)return 5000+days(r.opens);return 9000};

  const countries=new Set(ROWS.map(r=>r.region)).size,fields=new Set(ROWS.map(r=>r.field).filter(f=>f!=="any")).size,active=allRows().filter(r=>["Contacted","Applied","Interview","Offer"].includes(state.status[r.id])).length;
  const group=(k,label,sub)=>{const g=vis.filter(r=>r.season===k);return g.length?`<section class="list"><h2>${label}</h2><p class="sub">${sub}</p>${g.map(rowHTML).join("")}</section>`:""};
  const urgent=ROWS.map(r=>{const tm=timing(r);return r.urgent?{r,t:r.urgent}:(tm&&tm.k==="urgent"?{r,t:tm.t}:null)}).filter(Boolean);
  const sel=(id,key,first,map)=>`<div class="field"><label for="${id}">${first}</label><select id="${id}" data-flt="${key}">${opt("all","All",F[key])}${Object.entries(map).map(([k,v])=>opt(k,v,F[key])).join("")}</select></div>`;
  app.innerHTML=`<header><h1>Placement Atlas 2027</h1>

  ${urgent.length?`<p class="soon"><b>Closing soon:</b> ${urgent.map(({r,t})=>`<a href="#row-${r.id}" data-jump="${r.id}">${esc(r.org)}</a> (${esc(t.toLowerCase())})`).join(", ")}</p>`:""}
  <form class="search" id="sform" role="search"><label for="f-q" class="sr">Search opportunities</label><input type="search" id="f-q" placeholder="Search: firm, city or subject" value="${esc(q)}"><button type="submit" class="btn">Search</button></form>
  <section class="panel" aria-labelledby="fm"><h2 id="fm">What can I apply for?</h2>
  <p>Fill in what you know. Every listing below will then say whether it's open to you, and the best fits for your subject move to the top. Nothing you enter leaves this browser.</p>
  <div class="fields">
   <div class="field"><label for="p-subj">What I study</label><select id="p-subj" data-p="subj">${opt("","Choose…",prof.subj)}${Object.entries(SUBJ).map(([k,v])=>opt(k,v,prof.subj)).join("")}</select></div>
   <div class="field"><label for="p-year">My year (2026/27)</label><select id="p-year" data-p="year">${opt("","Choose…",prof.year)}${opt("1","First year",prof.year)}${opt("2","Penultimate year",prof.year)}${opt("3","Final year",prof.year)}${opt("pg","Postgraduate or graduate",prof.year)}</select></div>
   <div class="field"><label for="p-res">Where I'm from</label><select id="p-res" data-p="res">${opt("","Choose…",prof.res)}${opt("uk","UK or Irish citizen",prof.res)}${opt("eu","EU citizen",prof.res)}${opt("hkpr","Hong Kong permanent resident",prof.res)}${opt("hkres","Other Hong Kong resident",prof.res)}${opt("cn","Mainland China",prof.res)}${opt("us","US citizen or green card",prof.res)}${opt("other","Other nationality",prof.res)}</select></div>
   <div class="field"><label for="p-ukw">Can I work in the UK?</label><select id="p-ukw" data-p="ukw">${opt("","Choose…",prof.ukw)}${opt("full","Yes, unrestricted (citizen, settled, BN(O) or similar)",prof.ukw)}${opt("student","Student visa only",prof.ukw)}${opt("none","No",prof.ukw)}</select></div>
   <div class="field"><label for="p-uni">Where my university is</label><select id="p-uni" data-p="uni">${opt("","Choose…",prof.uni)}${opt("uk","United Kingdom",prof.uni)}${opt("hk","Hong Kong",prof.uni)}${opt("other","Elsewhere",prof.uni)}</select></div>
   <div class="field"><label for="p-age">My age</label><input type="number" id="p-age" data-p="age" min="16" max="60" value="${esc(prof.age)}"></div>
   <div class="field"><label for="p-fee">My fee status</label><select id="p-fee" data-p="fee">${opt("","Choose…",prof.fee)}${opt("home","Home",prof.fee)}${opt("intl","International",prof.fee)}</select></div>
  </div>
  ${sample?`<div class="needs"><label for="p-needs">Anything else? Tell the AI what you're after</label><textarea id="p-needs" data-p="needs" placeholder="e.g. First-year history student, interested in policy or law, want something in London or Hong Kong this summer">${esc(prof.needs)}</textarea></div>
  <div class="actions"><button type="button" class="btn" id="ask"${ai.busy?" disabled":""}>Suggest what to apply for</button>${ai.busy?`<button type="button" class="btn ghost" id="stop">Stop</button>`:""}<p class="hint">Runs on your own Claude account, which asks your permission the first time.</p></div>${resultHTML()}`:``}
  </section>
  <details class="visa"><summary>Not from the UK or Hong Kong? Read this about visas first</summary><ul>
   <li><b>UK, on a Student visa:</b> how much you can work depends on your course and whether it's term time, so check with your university's international advice team. Some employers need unrestricted right to work and won't accept a Student visa. <a href="https://www.gov.uk/student-visa/what-you-can-and-cannot-do" target="_blank" rel="noopener">GOV.UK Student visa rules</a></li>
   <li><b>Hong Kong, UK nationals aged 18–30:</b> the Working Holiday Scheme has 1,000 UK places a year and allows up to 12 months of work in total. <a href="https://whs.gov.hk/en/quota-and-condition-of-stay.php" target="_blank" rel="noopener">Quotas and conditions</a></li>
   <li><b>Hong Kong, other nationalities including mainland China:</b> internships are usually on a training visa or entry permit of up to 12 months, normally applied for with the employer. <a href="https://www.info.gov.hk/gia/general/202605/13/P2026051300283.htm" target="_blank" rel="noopener">Government statement, May 2026</a></li>
   <li>Rules change, so always confirm with the relevant immigration authority before accepting an offer.</li></ul></details>
  <div class="toolbar">${sel("f-field","field","Field",FIELD)}${sel("f-region","region","Where",REGION)}${sel("f-season","season","When",{easter:"Insight weeks & spring",summer:"Summer work",school:"Summer schools abroad"})}<div class="field"><label for="f-sort">Sort by</label><select id="f-sort">${opt("match","Best match",sortBy)}${opt("deadline","Closing soonest",sortBy)}${opt("az","A–Z",sortBy)}</select></div></div>
  ${(prof.res||prof.year||prof.ukw||prof.subj)?`<label class="toggle"><input type="checkbox" id="mine"${onlyMine?" checked":""}> Only show what I can apply for</label>`:""}
  <p class="count" id="results">Showing ${vis.length} of ${ROWS.length}${active?` · you're working on ${active}`:""}</p>
  ${group("easter","Insight weeks and spring","Short programmes, often only for first-years. Most open over winter, so this is where to start.")}${group("summer","Summer work","Internships and work experience. Big schemes open from October; small firms are happy to hear from you in February or March.")}${group("school","Summer schools abroad","Three to six weeks of study. Before paying full fees, ask your university's study abroad team: partner places often come with tuition waived.")}
  ${vis.length?"":`<p class="hint">Nothing matches${q?` "${esc(q)}"`:""} yet. Try another word, clear the filters, or check the job boards below.</p>`}
  <section class="panel" aria-labelledby="mf"><h2 id="mf">Track something you found yourself</h2>
  <p>Add any opportunity to keep it alongside these, with your own status and notes. It stays in this browser.</p>
  <div class="fields"><div class="field"><label for="c-org">Organisation</label><input type="text" id="c-org" maxlength="80"></div><div class="field"><label for="c-role">Role</label><input type="text" id="c-role" maxlength="120"></div><div class="field"><label for="c-dl">Deadline</label><input type="text" id="c-dl" maxlength="60" placeholder="e.g. 15 January"></div><div class="field"><label for="c-url">Link (optional)</label><input type="url" id="c-url" maxlength="400" placeholder="https://"></div></div>
  <div class="actions"><button type="button" class="btn" id="c-add">Add to my tracker</button><button type="button" class="btn ghost" id="export">Download my tracker (CSV)</button><span class="hint" aria-live="polite">${esc(formMsg)}</span></div>
  ${custom.items.length?custom.items.map(c=>rowHTML(Object.assign({custom:true},c))).join(""):""}
  </section>
  <section class="panel" aria-labelledby="pm"><h2 id="pm">Join your professional body as a student</h2><p>It's free or nearly free, it looks good on applications, and it gets you into events where you meet people who hire. These are the ones for planning and real estate. For other subjects, ask your department which body to join.</p>
  <dl class="boards"><dt>RICS</dt><dd>Surveying and real estate · <b>free</b> · networking events, mentoring, jobs hub · <a href="https://rics.org/join-rics/rics-member-grades/rics-student" target="_blank" rel="noopener">Join</a></dd><dt>RTPI</dt><dd>Town planning (UK) · <b>free</b> on RTPI-accredited courses · <a href="https://www.rtpi.org.uk/membership/join-us/membership-classes/student/" target="_blank" rel="noopener">Join</a></dd><dt>HKIS</dt><dd>Surveying (Hong Kong) · <b>HK$70 a year</b> · check your degree is recognised first · <a href="https://wwww.hkis.org.hk/en/membership_become.html" target="_blank" rel="noopener">Details</a></dd></dl></section>
  <section aria-labelledby="jb" class="list"><h2 id="jb">Where else to look</h2><p class="sub">No single page can list everything. These are the job boards I'd check for each subject, plus your university careers service.</p>
  <dl class="boards">${BOARDS.map(([k,list])=>`<dt>${esc(k)}</dt><dd>${list.map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(n)}</a>`).join(" · ")}</dd>`).join("")}</dl></section>
  ${!comm&&FEEDBACK_URL?`<section class="panel" aria-labelledby="fb2"><h2 id="fb2">Spotted a mistake or a missing scheme?</h2><p>Tell me. I read every message and fix things quickly.</p><p><a class="btn" href="${esc(FEEDBACK_URL)}" target="_blank" rel="noopener">Send feedback</a></p></section>`:""}
  ${comm?`<section class="panel" id="fb-panel" aria-labelledby="fb"><h2 id="fb">Spotted a mistake or a missing scheme?</h2><p>Tell me. I read every comment and fix things quickly.</p><div class="actions"><button type="button" class="btn" id="fb-btn">Leave feedback</button></div></section>`:""}
  <footer><p>Last checked ${LAST_CHECKED}. Deadlines and rules change, so always confirm on the official page before you apply. I'm not linked to any of the employers or universities listed.</p><p>${stored?"Your answers, statuses, notes and finds stay in this browser. Nobody else can see them, including me.":"Your browser isn't letting this page save, so your answers will clear when you leave."}</p></footer>`;
}
function rerender(){const a=document.activeElement,id=a&&a.id,s=a&&a.selectionStart;render();if(id){const n=document.getElementById(id);if(n){n.focus();try{if(s!=null)n.setSelectionRange(s,s)}catch(e){}}}}
async function ask(){
  if(!sample||ai.busy)return;
  const ta=document.getElementById("p-needs");if(ta){prof.needs=ta.value;put(PKEY,prof)}
  ai={busy:true,result:null,error:"",ctl:new AbortController()};rerender();
  const listings=ROWS.map(r=>({id:r.id,org:r.org,role:r.role,field:FIELD[r.field],any_degree:!!r.anyDegree,country:REGION[r.region],place:r.place,season:r.season,when:r.when,pay:r.pay,deadline:r.deadline,eligibility_for_this_student:elig(r).t,details:r.how}));
  const lab={uk:"UK or Irish citizen",eu:"EU citizen",hkpr:"Hong Kong permanent resident",hkres:"Hong Kong resident (not permanent)",cn:"Mainland China",us:"US citizen or green card",other:"Other nationality"};
  const wl={full:"unrestricted",student:"Student visa only",none:"none"};
  const student={degree_subject:SUBJ[prof.subj]||"not given",year_in_2026_27:prof.year||"not given",nationality_or_residency:lab[prof.res]||"not given",uk_right_to_work:wl[ukStatus()]||"not given",university_country:prof.uni||"not given",age:prof.age||"not given",fee_status:prof.fee||"not given",in_their_words:(prof.needs||"").slice(0,1500)};
  const prompt=`You are a careers adviser for university students of any nationality, degree subject and year, looking for insight weeks, internships, placements or summer schools in 2027, in the UK or abroad. Today is 20 October 2026.

Student:
${JSON.stringify(student)}

Listings (the only specific opportunities you may recommend by id; "eligibility_for_this_student" has already been worked out from their answers):
${JSON.stringify(listings)}

Task: pick up to 6 listings that genuinely fit this student's subject, year, location wishes and goals. Never recommend a listing whose eligibility starts with "Not open to you". "Any degree" listings are open to all subjects. If few listings fit their subject, recommend fewer and say so. Mention urgent deadlines first. For each, give one or two plain sentences on why it fits and one concrete first step. Then give up to 5 other ideas tailored to their subject and year: kinds of employers, schemes or routes, and when such schemes usually open (never invent specific company deadlines). Add one short caution about visas or eligibility if relevant, otherwise an empty string.

Reply with only JSON in this shape:
{"summary":"one or two sentences","matches":[{"id":"listing id","why":"...","first_step":"..."}],"other_ideas":["..."],"caution":"..."}`;
  try{
    const r=await sample.json(prompt,{signal:ai.ctl.signal});
    ai={busy:false,result:(r&&typeof r==="object")?r:null,error:(r&&typeof r==="object")?"":"The answer didn't come back in the right shape. Try again.",ctl:null};
  }catch(e){
    const c=e&&e.code;
    if(c==="cancelled")ai={busy:false,result:null,error:"",ctl:null};
    else if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){sample=null;ai={busy:false,result:null,error:"",ctl:null}}
    else ai={busy:false,result:null,error:c==="rate_limited"?"Too many requests just now. Try again in a little while.":c==="session_expired"?"Sign in to Claude again, then try once more.":c==="invalid_json"?"The answer didn't come back in the right shape. Try again.":"Something went wrong while matching. Try again.",ctl:null};
  }
  rerender();
}
function addCustom(){
  const g=id=>(document.getElementById(id)||{value:""}).value.trim();
  const org=g("c-org");if(!org){formMsg="Add the organisation name first.";rerender();return}
  const url=g("c-url");
  custom.items.push({id:"c"+Date.now(),org,role:g("c-role"),deadline:g("c-dl"),url:safeUrl(url)});
  put(CKEY,custom);formMsg="Added to your tracker.";render();
}
document.addEventListener("click",e=>{
  if(e.target.closest("#ask")){ask();return}
  if(e.target.closest("#stop")){ai.ctl&&ai.ctl.abort();return}
  const cp=e.target.closest("[data-copy]");if(cp){const v=cp.dataset.copy;const ok=()=>{cp.textContent="Copied";setTimeout(()=>{cp.textContent="Copy email"},1500)};try{navigator.clipboard.writeText(v).then(ok,()=>{cp.textContent=v})}catch(err){cp.textContent=v}return}
  if(e.target.closest("#c-add")){addCustom();return}
  if(e.target.closest("#export")){exportCSV();return}
  if(e.target.closest("#fb-btn")&&comm){comm.openComposer({element:document.getElementById("fb-panel")}).catch(()=>{comm=null;rerender()});return}
  const d=e.target.closest("[data-del]");if(d){custom.items=custom.items.filter(c=>c.id!==d.dataset.del);put(CKEY,custom);formMsg="Removed.";render();return}
  const j=e.target.closest("[data-jump]");if(j){e.preventDefault();hl=j.dataset.jump;F={field:"all",region:"all",season:"all"};onlyMine=false;render();const n=document.getElementById("row-"+hl);if(n)n.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})}
});
document.addEventListener("change",e=>{const t=e.target;
  if(t.matches("select[data-id]")){state.status[t.dataset.id]=t.value;put(KEY,state);rerender();return}
  if(t.matches("select[data-flt]")){F[t.dataset.flt]=t.value;rerender();return}
  if(t.id==="f-sort"){sortBy=t.value;rerender();return}
  if(t.matches("[data-p]")&&t.dataset.p!=="needs"){prof[t.dataset.p]=t.value;put(PKEY,prof);rerender();return}
  if(t.id==="mine"){onlyMine=t.checked;render()}
});
function csvCell(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
async function exportCSV(){
  const rows=allRows().filter(r=>r.custom||(state.status[r.id]&&state.status[r.id]!=="Not started")||state.notes[r.id]);
  if(!rows.length){formMsg="Set a status or add a note on a listing first, then export.";rerender();return}
  const head=["Organisation","Role","Country","Deadline","My status","My notes","Link"];
  const lines=[head].concat(rows.map(r=>[r.org,r.role,REGION[r.region]||"",r.deadline,state.status[r.id]||"Not started",state.notes[r.id]||"",r.url||""]));
  const data=lines.map(l=>l.map(csvCell).join(",")).join("\n");
  try{if(dl){await dl.save({filename:"my-placement-tracker.csv",data})}else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+data],{type:"text/csv;charset=utf-8"}));a.download="my-placement-tracker.csv";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}formMsg="Tracker downloaded."}
  catch(e){const c=e&&e.code;if(c==="declined"){formMsg="Download cancelled."}else if(c==="rate_limited"){formMsg="A download prompt is already open."}else{dl=null;formMsg="Downloads aren't available here."}}
  rerender();
}
document.addEventListener("toggle",e=>{const d=e.target;if(d&&d.dataset&&d.dataset.openId){if(d.open)OPEN.add(d.dataset.openId);else OPEN.delete(d.dataset.openId)}},true);
document.addEventListener("submit",e=>{if(e.target.id==="sform"){e.preventDefault();const i=document.getElementById("f-q");q=i?i.value.trim():"";F={field:"all",region:"all",season:"all"};render();const n=document.getElementById("results");if(n)n.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})}});
document.addEventListener("input",e=>{if(e.target.id==="f-q"){q=e.target.value;rerender()}});
document.addEventListener("focusout",e=>{const t=e.target;
  if(t.matches("textarea[data-id]")&&(state.notes[t.dataset.id]||"")!==t.value){state.notes[t.dataset.id]=t.value;put(KEY,state)}
  if(t.id==="p-needs"&&prof.needs!==t.value){prof.needs=t.value;put(PKEY,prof)}
});
render();
try{const h=location.hash;if(/^#row-[A-Za-z0-9_-]+$/.test(h)&&ROWS.some(r=>"row-"+r.id===h.slice(1))){hl=h.slice(5);render();const n=document.getElementById(h.slice(1));if(n)n.scrollIntoView({block:"start"})}}catch(e){}
if(window.claude&&window.claude.use){window.claude.use("sample").then(s=>{if(s){sample=s;rerender()}}).catch(()=>{});window.claude.use("comments").then(c=>{if(c){comm=c;rerender()}}).catch(()=>{});window.claude.use("downloads").then(d=>{if(d){dl=d;rerender()}}).catch(()=>{})}
})();
</script>
